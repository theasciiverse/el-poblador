# Asciiverse release workflow (tag v* or run by hand with a tag)
# Builds El Poblador for the Asciiverse catalog and as system packages.
# Upstream (git.sr.ht/~vicho/el_poblador) builds on builds.sr.ht and has no
# GitHub workflow, so nothing here replaces one.
#
# For av: one archive per target, named <id>-<target>.tar.gz (Linux, macOS)
# or .zip (Windows), plus a SHA256SUMS file, attached to a GitHub release
# (hub/catalog/SCHEMA.md, release.source = "github").
# For everyone else: .deb, .rpm, .apk and Arch packages from the same Linux
# binaries, made by nfpm (asciiverse/nfpm.yaml).
#
# Tags look like v0.3.0+20261105-av.1: upstream's last tag, the date of the
# upstream commit built, then our packaging release. Pure Go with CGO off,
# so every target cross-compiles on one Linux runner into a static binary.

name: release

on:
  push:
    tags: ["v*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: el-poblador
  BIN: el_poblador
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          mkdir -p dist
          build() { # goos goarch target-triple
            out="stage-$3"; mkdir -p "$out"
            exe="$BIN"; [ "$1" = windows ] && exe="$BIN.exe"
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w" -o "$out/$exe" .
            cp LICENSE README.md PATCHES.md "$out/"
            if [ "$1" = windows ]; then (cd "$out" && zip -q -r "../dist/$ID-$3.zip" .)
            else tar -czf "dist/$ID-$3.tar.gz" -C "$out" .; fi
          }
          build linux   amd64 x86_64-unknown-linux-musl
          build linux   arm64 aarch64-unknown-linux-musl
          build darwin  amd64 x86_64-apple-darwin
          build darwin  arm64 aarch64-apple-darwin
          build windows amd64 x86_64-pc-windows-msvc
          build windows arm64 aarch64-pc-windows-msvc
          ls -l dist

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${v##*-av.}"
          for pair in amd64:x86_64 arm64:aarch64; do
            export ARCH="${pair%%:*}"
            rm -rf stage && cp -r "stage-${pair##*:}-unknown-linux-musl" stage
            for p in deb rpm apk archlinux; do
              docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
                -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
                package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
            done
          done
          ls -l dist

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "El Poblador $TAG" \
                 --notes "El Poblador ${TAG%%-av.*} from git.sr.ht/~vicho/el_poblador, built for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. Changes from upstream: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
