# System packages (.deb, .rpm, .apk, Arch) for El Poblador, built by nfpm
# from the same static binary as the av archive. The release workflow sets
# VERSION, RELEASE (our packaging release) and ARCH (amd64 or arm64), and
# puts the binary at stage/el_poblador.
#
# No .desktop file on purpose: av is the one place titles are started from,
# so Asciiverse packages never add menu entries (asciiverse/CLAUDE.md).
name: el-poblador
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/el-poblador
license: EUPL-1.2
description: |
  Island-settling board game for three or four players in the terminal.
  Gather wood, brick, sheep, wheat and ore, trade with each other, build
  roads, settlements and cities, and be first to ten points. Hot-seat at
  one keyboard, or online over SSH. By Vicente Reyes, packaged by
  Asciiverse.
contents:
  - src: stage/el_poblador
    dst: /usr/bin/el_poblador
    file_info: { mode: 0755 }
  - src: LICENSE
    dst: /usr/share/doc/el-poblador/copyright
    file_info: { mode: 0644 }
  - src: PATCHES.md
    dst: /usr/share/doc/el-poblador/PATCHES.md
    file_info: { mode: 0644 }
  - src: README.md
    dst: /usr/share/doc/el-poblador/README.md
    file_info: { mode: 0644 }
